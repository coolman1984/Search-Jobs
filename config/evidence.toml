# The only evidence a draft may cite. Mirrors profile/PROFILE.md §4a (safe projects).
# claims = exact phrases (and the numbers inside them) a draft is allowed to state.
# A draft that names a project or a number not listed here is refused by the claims checker.

[owner]
claims = ["14+ years", "14 years", "+14", "14 سنة", "14 عامًا", "21,667", "21.6k", "21 ألف", "11 courses", "11 كورس"]
allowed_projects = ["Delivery-Manager", "Teachers", "Accounting-sys", "Business-Template", "3D-Modeling",
  "Seramic-Rondi", "Office-Automation", "Perfect-Project-Template", "Excel-Automation-V.2", "win-agent-desktop",
  "Performance", "Economic", "Animation", "Personal-Web", "Excel-Data-Extractor", "Files_-_OCR"]

[evidence.delivery]
name_en = "multi-company delivery platform"
name_ar = "منصة توصيل لأكتر من شركة"
repo = "Delivery-Manager"
services = ["business_system"]
segments = ["logistics", "restaurants", "ecommerce"]
claims = ["107 tests", "~107", "daily settlement", "تسوية يومية"]
line_en = "I built a delivery platform where each company's data is isolated, with customer, store, rider and operations screens and a daily cash settlement."
line_ar = "بنيت منصة توصيل لكذا شركة، كل شركة بياناتها معزولة، وفيها شاشات للعميل والمحل والطيار والتشغيل، وتسوية يومية للتحصيل."

