# Service detection keywords -> service id (profile/SERVICES.md) and price bands per region.
[services.business_system]
keywords = ["system", "platform", "booking", "crm", "portal", "management", "app", "نظام", "منصة", "حجز", "برنامج"]
price = { EG = "15,000–60,000 EGP + 500–1,500 EGP/month", GULF = "6,000–20,000 SAR", GLOBAL = "USD 1,500–6,000" }
duration = "2–6 weeks"

[services.excel_automation]
keywords = ["excel", "vba", "spreadsheet", "report", "office", "إكسل", "اكسل", "تقرير"]
price = { EG = "3,000–20,000 EGP", GULF = "1,500–8,000 SAR", GLOBAL = "USD 300–2,500 or USD 30–60/h" }
duration = "3 days–2 weeks"

[services.ai_agents]
keywords = ["ai", "agent", "llm", "automation", "workflow", "n8n", "zapier", "gpt", "أتمتة", "ذكاء"]
price = { EG = "10,000–50,000 EGP", GULF = "4,000–20,000 SAR", GLOBAL = "USD 40–85/h or USD 1,000–6,000" }
duration = "1–4 weeks"

[services.dashboards]
keywords = ["dashboard", "power bi", "analytics", "kpi", "data analysis", "لوحة", "تحليل"]
price = { EG = "8,000–35,000 EGP", GULF = "3,000–15,000 SAR", GLOBAL = "USD 800–4,000" }
duration = "1–3 weeks"

[services.motion_video]
keywords = ["motion", "video", "animation", "explainer", "reels", "ad", "موشن", "فيديو", "إعلان"]
price = { EG = "4,000–12,000 EGP per 30 s", GULF = "1,500–5,000 SAR", GLOBAL = "USD 600–2,000 per 30 s" }
duration = "3–7 days"

[services.training]
keywords = ["training", "workshop", "course", "trainer", "تدريب", "ورشة", "كورس"]
price = { EG = "to be confirmed", GULF = "AED 8,000–15,000 half day · AED 15,000–30,000 full day", GLOBAL = "EUR 1,500–3,500 per day" }
